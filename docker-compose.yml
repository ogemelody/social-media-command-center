services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: commandos
      POSTGRES_USER: commandos
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commandos -d commandos"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - commandos-postgres:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      COMMANDOS_DATABASE_URL: postgresql+psycopg://commandos:local-development-only@database:5432/commandos
      COMMANDOS_AUTO_CREATE_SCHEMA: "false"
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  commandos-postgres:
